name: Spec approved

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  spec-approved:
    runs-on: ubuntu-latest
    concurrency:
      group: spec-approved-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      LC_ALL: C
    steps:
      - name: Require pull request head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$HEAD_SHA" ] || [ -z "$PR_NUMBER" ]; then
            echo "spec-approved: pull request unavailable"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch pull request head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! git fetch --force origin "+refs/pull/${PR_NUMBER}/head:refs/pull/${PR_NUMBER}/head"; then
            echo "spec-approved: pull request unavailable"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the base script
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "spec-approved: pull request unavailable"
            exit 1
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" && ! git fetch --force origin "$BASE_SHA"; then
            echo "spec-approved: pull request unavailable"
            exit 1
          fi
          if ! git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"; then
            echo "spec-approved: pull request unavailable"
            exit 1
          fi
          script="$RUNNER_TEMP/base/scripts/spec-approved.mjs"
          workflow="$RUNNER_TEMP/base/.github/workflows/spec-approved.yml"
          if [ ! -f "$script" ] && [ ! -f "$workflow" ]; then
            echo "bootstrap: no base script"
            exit 0
          fi
          if [ ! -f "$script" ] || [ ! -f "$workflow" ]; then
            echo "spec-approved: partial base"
            exit 1
          fi
          node --test "$RUNNER_TEMP/base/scripts/spec-approved.test.mjs"
          node "$script"
